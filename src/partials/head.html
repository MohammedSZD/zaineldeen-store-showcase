<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Set language and direction before first paint to avoid a layout flash.
  (function () {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      var s = localStorage.getItem('zaineldeen:lang');
      var l = q === 'ar' || q === 'en' ? q : s === 'ar' || s === 'en' ? s : 'en';
      document.documentElement.lang = l;
      document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>
