<!doctype html>
<html lang="en">
<head>
  <!--include:head-->
  <title>Shop — Zain El Deen Store</title>
  <meta name="description" content="Browse the Zain El Deen Store showcase catalog: perfumes, makeup, skincare, pajamas and electrical devices. Search, filter and sort.">
  <meta property="og:title" content="Shop — Zain El Deen Store">
  <meta property="og:description" content="Browse the Zain El Deen Store showcase catalog: perfumes, makeup, skincare, pajamas and electrical devices. Search, filter and sort.">
</head>
<body class="page-shop">
  <!--include:header-->
  <main id="main">
    <section class="page-head">
      <div class="container">
        <nav class="crumbs" data-i18n-attr="aria-label:crumbs.aria" aria-label="Breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> <span aria-hidden="true">/</span> <span aria-current="page" data-i18n="nav.shop">Shop</span></nav>
        <h1 id="shop-title" data-i18n="shop.title">Shop the collection</h1>
        <p class="lead" id="shop-lead" data-i18n="shop.lead">Perfumes, makeup, skincare, sleepwear and personal-care devices.</p>
      </div>
    </section>

    <section class="container shop" data-i18n-attr="aria-label:shop.catalog.aria" aria-label="Catalog">
      <h2 class="sr-only" data-i18n="shop.products.heading">Products</h2>
      <form class="toolbar" id="toolbar" role="search" data-i18n-attr="aria-label:shop.toolbar.aria" aria-label="Search and filter products" autocomplete="off">
        <div class="field field--grow">
          <label for="shop-q" data-i18n="shop.search.label">Search</label>
          <input id="shop-q" type="search" data-i18n-attr="placeholder:shop.search.placeholder" placeholder="Try “chanel”, “lipstick” or “pajama”">
        </div>
        <div class="field">
          <label for="shop-sort" data-i18n="shop.sort.label">Sort by</label>
          <select id="shop-sort"></select>
        </div>
        <label class="check">
          <input id="shop-saved" type="checkbox">
          <span data-i18n="shop.saved.only">Saved only</span>
        </label>
      </form>

      <div class="chips" id="cat-chips" role="group" data-i18n-attr="aria-label:shop.filter.cat" aria-label="Filter by category"></div>
      <div class="chips chips--sub" id="sub-chips" role="group" data-i18n-attr="aria-label:shop.filter.sub" aria-label="Filter by type" hidden></div>

      <div class="brandbar" id="brandbar" hidden>
        <div class="brandbar__row">
          <button type="button" class="filter-btn" id="brand-toggle" aria-expanded="false" aria-controls="brand-panel">
            <span data-i18n="shop.brand.label">Brand</span>
            <span class="filter-btn__count" id="brand-count" hidden></span>
            <svg class="filter-btn__chev" aria-hidden="true" width="18" height="18"><use href="#i-chevron"/></svg>
          </button>
          <ul class="pills" id="brand-pills" data-i18n-attr="aria-label:shop.brand.selected.aria" aria-label="Selected brands"></ul>
          <button type="button" class="link-clear" id="brand-clear" hidden data-i18n="shop.brand.clear">Clear brands</button>
        </div>
        <div class="brand-panel" id="brand-panel" role="group" data-i18n-attr="aria-label:shop.brand.group" aria-label="Brands" hidden>
          <ul class="brand-list" id="brand-list"></ul>
        </div>
      </div>

      <p class="results" id="results" role="status" aria-live="polite"></p>
      <div class="grid" id="product-grid"></div>
      <div class="empty" id="empty" hidden>
        <h2 id="empty-title">Nothing found</h2>
        <p id="empty-text"></p>
        <button class="btn btn--primary" type="button" id="reset" data-i18n="shop.reset">Clear filters</button>
      </div>
    </section>
  </main>
  <!--include:footer-->
  <script type="module" src="/src/pages/shop.js"></script>
</body>
</html>
